<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mira Chromium Mobile Browser</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="mode-normal theme-tokyonight">

  <!-- Top Glassmorphic Navigation Bar -->
  <div class="browser-navbar">
    <button class="nav-btn" id="btn-back" title="Back" onclick="navGoBack()">‹</button>
    <button class="nav-btn" id="btn-forward" title="Forward" onclick="navGoForward()">›</button>
    
    <!-- Address & Search Bar Card -->
    <div class="address-bar-card">
      <span class="ssl-icon" id="ssl-status">🔒</span>
      <input type="url" id="url-input" placeholder="Search Google or enter URL..." autocomplete="off" spellcheck="false">
      <button class="nav-btn-icon" id="btn-clear" style="display:none;" onclick="clearUrlInput()">✕</button>
      <button class="nav-btn-icon" title="Reload" onclick="navReload()">↻</button>
    </div>

    <!-- AI Assistant Trigger -->
    <button class="ai-nav-badge" title="Mira AI" onclick="toggleAISidebar()">⚡ AI</button>

    <!-- Home Button -->
    <button class="nav-btn" title="Home" onclick="navGoHome()">🏠</button>
  </div>

  <!-- Loading Progress Bar -->
  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <!-- Speed Dial Start Dashboard -->
  <div class="dashboard-wrapper" id="dashboard-wrapper">
    <div class="brand-hero">
      <div class="brand-logo-glow">⚡</div>
      <h1 class="brand-title">Mira Browser</h1>
      <p class="brand-subtitle">Fast • Private • AI-Accelerated Chromium</p>
    </div>

    <!-- Search Box in Dashboard -->
    <div class="dashboard-search-card">
      <input type="text" id="dash-search-input" placeholder="Search web or type URL..." autocomplete="off">
      <button class="dash-search-btn" onclick="executeDashSearch()">GO</button>
    </div>

    <!-- Speed Dial Shortcuts Grid -->
    <div class="speed-dial-section">
      <h3 class="section-title">TOP SITES</h3>
      <div class="speed-dial-grid">
        <div class="speed-tile" onclick="openSite('https://www.google.com')">
          <div class="tile-icon google">G</div>
          <span class="tile-name">Google</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://www.youtube.com')">
          <div class="tile-icon youtube">▶</div>
          <span class="tile-name">YouTube</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://duckduckgo.com')">
          <div class="tile-icon ddg">🦆</div>
          <span class="tile-name">DuckDuckGo</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://www.wikipedia.org')">
          <div class="tile-icon wikipedia">W</div>
          <span class="tile-name">Wikipedia</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://github.com')">
          <div class="tile-icon github">🐙</div>
          <span class="tile-name">GitHub</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://www.reddit.com')">
          <div class="tile-icon reddit">🤖</div>
          <span class="tile-name">Reddit</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://chatgpt.com')">
          <div class="tile-icon chatgpt">⚡</div>
          <span class="tile-name">ChatGPT</span>
        </div>
        <div class="speed-tile" onclick="openSite('https://news.google.com')">
          <div class="tile-icon news">📰</div>
          <span class="tile-name">News</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Fast Bar -->
  <div class="browser-bottom-bar">
    <button class="b-btn" title="Back" onclick="navGoBack()">‹</button>
    <button class="b-btn active" title="Home" onclick="navGoHome()">🏠</button>
    <button class="b-btn" title="Mira AI" onclick="toggleAISidebar()">⚡ AI</button>
    <button class="b-btn" title="Reload" onclick="navReload()">↻</button>
  </div>

  <!-- Built-in AI Assistant Drawer Modal -->
  <div class="modal-overlay" id="ai-sidebar-modal">
    <div class="modal-card ai-sidebar-card">
      <div class="modal-header">
        <h3>⚡ Mira AI Assistant</h3>
        <button class="close-btn" onclick="toggleAISidebar()">✕</button>
      </div>
      <div class="ai-quick-actions">
        <button class="ai-chip" onclick="aiSummarizePage()">📄 Summarize Page</button>
        <button class="ai-chip" onclick="aiKeyTakeaways()">💡 Key Takeaways</button>
        <button class="ai-chip" onclick="aiTranslatePage()">🌐 Translate</button>
      </div>
      <div class="ai-chat-history" id="ai-chat-history">
        <div class="ai-msg bot">⚡ Hello! I am your Mira AI Assistant. Type your question or search prompt below!</div>
      </div>
      <div class="ai-input-row">
        <input type="text" id="ai-chat-input" placeholder="Ask Mira AI..." autocomplete="off">
        <button class="ai-send-btn" onclick="sendAIMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
