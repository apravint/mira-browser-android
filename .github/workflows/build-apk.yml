name: Build & Release Mira Mobile Browser APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analyzer
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename & Organize APK Artifacts
        run: |
          mkdir -p dist/
          cp build/app/outputs/flutter-apk/app-release.apk dist/MiraBrowser-Universal-v${{ github.ref_name }}.apk 2>/dev/null || cp build/app/outputs/flutter-apk/app-release.apk dist/MiraBrowser-Universal-latest.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/MiraBrowser-arm64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MiraBrowser-armeabi-v7a.apk 2>/dev/null || true
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiraBrowser-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
